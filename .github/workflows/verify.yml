name: verify
# Executor-independent verification. Runs on GitHub's runners, not in the agent's VM.
# Free on public repositories with standard runners. Read the result from the Actions tab
# on your phone: each job summary carries size, sha256, and every finding verbatim.
#
# Batch V (owner-approved 2026-09-01): a second job runs the G0 golden money-path gate on the
# runner's preinstalled Google Chrome, so "byte-identical pricing" is checked outside any seat.
# Batch W (there is no local seat): a third job runs the batch gate tools/sweep/probe-v.mjs on the
# same Chrome against the synthetic demo and a generated synthetic plan; every batch since adds its
# own probe to that job (probe-x … probe-af — the list is the step below).
# Actions are pinned by commit SHA and the token is read-only (least privilege).
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: ves-verify
        shell: bash
        run: |
          set +e
          node tools/ves-verify.mjs | tee verify.txt
          code=${PIPESTATUS[0]}
          {
            echo '## ves-verify'
            echo
            echo '```'
            cat verify.txt
            echo '```'
            echo
            echo "exit code: $code"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      # Batch B5 (R-6c): the vocabulary gate — banned words, VOCAB column words reaching their
      # templates, and a name built straight from an id instead of itemLabel()/descOf(). Zero-dep,
      # static; no Chrome needed, so it runs beside ves-verify rather than in the Chrome jobs below.
      - name: vocab-check
        shell: bash
        run: |
          set +e
          node tools/vocab-check.mjs src/VES_PM.html | tee vocab.txt
          code=${PIPESTATUS[0]}
          {
            echo '## vocab-check'
            echo
            echo '```'
            cat vocab.txt
            echo '```'
            echo
            echo "exit code: $code"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: g0 golden money-path gate
        shell: bash
        env:
          VES_CHROME: google-chrome
        run: |
          set +e
          { google-chrome --version; node --version; node gate/g0.mjs check src/VES_PM.html; } 2>&1 | tee gate.txt
          code=${PIPESTATUS[0]}
          {
            echo '## g0 gate'
            echo
            echo '```'
            cat gate.txt
            echo '```'
            echo
            echo "exit code: $code"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: sweep probes (probe-v … probe-af)
        shell: bash
        env:
          VES_CHROME: google-chrome
        run: |
          set +e
          node tools/sweep/mkpdf.mjs "$RUNNER_TEMP/plan.pdf" | tee probes.txt
          node tools/sweep/mkpdf.mjs "$RUNNER_TEMP/plan-dense.pdf" 40000 | tee -a probes.txt
          node tools/sweep/probe-v.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$RUNNER_TEMP/plan.pdf" "$PWD" 2>&1 | tee -a probes.txt
          code=${PIPESTATUS[0]}
          node tools/sweep/probe-x.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$RUNNER_TEMP/plan-dense.pdf" "$PWD" 2>&1 | tee -a probes.txt
          code2=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code2
          node tools/sweep/probe-y.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$RUNNER_TEMP/plan.pdf" "$PWD" 2>&1 | tee -a probes.txt
          code3=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code3
          node tools/sweep/probe-z.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" 2>&1 | tee -a probes.txt
          code4=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code4
          node tools/sweep/probe-aa.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$RUNNER_TEMP/plan.pdf" "$PWD" 2>&1 | tee -a probes.txt
          code5=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code5
          node tools/sweep/probe-ac.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" 2>&1 | tee -a probes.txt
          code6=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code6
          node tools/sweep/probe-ab.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" 2>&1 | tee -a probes.txt
          code7=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code7
          node tools/sweep/probe-ad.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" 2>&1 | tee -a probes.txt
          code8=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code8
          node tools/sweep/probe-u.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" 2>&1 | tee -a probes.txt
          code9=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code9
          node tools/sweep/probe-ae.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$RUNNER_TEMP/plan.pdf" "$PWD" 2>&1 | tee -a probes.txt
          code10=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code10
          # Batch AF: probe-af needs the F18.68 bytes to prove the old build drops a line formula LOUDLY (AF7).
          # The checkout is shallow, so the one commit is fetched by its FULL sha (git fetch takes a full object name,
          # never an abbreviation — Batch AG, P-SEAT pass 1 finding 2); the file never enters the working tree.
          OLD_SHA=b1914230a48a6f0fb8a7d0a3dfd67955a14c1721
          git fetch --no-tags --depth=1 origin "$OLD_SHA" 2>&1 | tee -a probes.txt
          if git show "$OLD_SHA:src/VES_PM.html" > "$RUNNER_TEMP/VES_F18.68.html" && [ -s "$RUNNER_TEMP/VES_F18.68.html" ]; then
            node tools/sweep/probe-af.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" "$RUNNER_TEMP/VES_F18.68.html" 2>&1 | tee -a probes.txt
            code11=${PIPESTATUS[0]}
          else
            echo "HARNESS FAIL: could not materialise the F18.68 bytes ($OLD_SHA) for probe-af" | tee -a probes.txt; code11=2
          fi
          [ "$code" = 0 ] && code=$code11
          # Batch B0 (VES 2): Patrick's 9/03 gates ported from branch kind-curie under p903-* names
          # (their probe-ae/probe-af file names collided with this branch's own AE/AF gates — different content).
          node tools/sweep/mkpdf.mjs "$RUNNER_TEMP/plan2.pdf" 1500 2 | tee -a probes.txt
          node tools/sweep/probe-p903-doc.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$RUNNER_TEMP/plan2.pdf" "$PWD" 2>&1 | tee -a probes.txt
          code12=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code12
          node tools/sweep/probe-p903-aim.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$RUNNER_TEMP/plan.pdf" "$PWD" 2>&1 | tee -a probes.txt
          code13=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code13
          node tools/sweep/probe-p903-rail.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" 2>&1 | tee -a probes.txt
          code14=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code14
          node tools/sweep/probe-p903-pitch.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" 2>&1 | tee -a probes.txt
          code15=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code15
          node tools/sweep/probe-p903-words.mjs "$PWD/src/VES_PM.html" "$PWD/release/demo/demo-flat-roof.json" "$PWD" 2>&1 | tee -a probes.txt
          code16=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code16
          # Batch B4 (R-10g): the takeoff prints every sheet. Runs the three-sheet fixture; its own subgates
          # re-run G0 and the B0-B3 probes, so this step is the one that says the paper did not move.
          node tools/sweep/probe-b4-print.mjs "$PWD/src/VES_PM.html" "$PWD/fixtures/synthetic/three-sheet/takeoff.v3.json" "$PWD/fixtures/synthetic/three-sheet/plan.pdf" "$PWD" 2>&1 | tee -a probes.txt
          code17=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code17
          # Batch B5 (VES 2): one description per item, EDGE column words — child gates skipped here (each is its own step above)
          node tools/sweep/probe-b5-words.mjs "$PWD/src/VES_PM.html" "$PWD/fixtures/synthetic/three-sheet/takeoff.v3.json" "$PWD/fixtures/synthetic/three-sheet/plan.pdf" "$PWD" --no-subgates 2>&1 | tee -a probes.txt
          code18=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code18
          # Batch B6F (VES 2): the one fix batch after the B6 persona pass — the pending money surfaces,
          # the pitch bounds, the general-line journal, the section key, the print latch, the region ids.
          node tools/sweep/probe-b6f.mjs "$PWD/src/VES_PM.html" "$PWD/fixtures/synthetic/three-sheet" "$PWD" 2>&1 | tee -a probes.txt
          code19=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code19
          # Batch Q1 (VES 2.1): deductions — a cutout inside a field area subtracts its SF, the clamp says so
          # out loud, and the perimeter handoff is one journal entry. The 2.0.0 release bytes are fetched by
          # their FULL sha (probe-af's precedent) so the row that proves a version-6 file is refused by the
          # last release can run; without them that half states it was not supplied instead of passing.
          Q1_OLD_SHA=d7f683ee5666f9627e847ff4ec0f4c26dc5612dd
          git fetch --no-tags --depth=1 origin "$Q1_OLD_SHA" 2>&1 | tee -a probes.txt
          git show "$Q1_OLD_SHA:src/VES_PM.html" > "$RUNNER_TEMP/VES_2.0.0.html" || true
          node tools/sweep/probe-deduct.mjs "$PWD/src/VES_PM.html" "$PWD/fixtures/synthetic/three-sheet" "$PWD" "$RUNNER_TEMP/VES_2.0.0.html" 2>&1 | tee -a probes.txt
          code20=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code20
          # Batch Q2 (VES 2.1): hide / solo — the rail-header strip, H / Shift+H, the region eye, and
          # the takeoff paper's indifference to all of it. No old build needed: every row here reads
          # the current bytes only.
          node tools/sweep/probe-hide.mjs "$PWD/src/VES_PM.html" "$PWD/fixtures/synthetic/three-sheet" "$PWD" 2>&1 | tee -a probes.txt
          code21=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code21
          # Batch Q3 (VES 2.1): selection affordances — the chip, move, duplicate, marquee, re-assign, Shift+Space,
          # the region ghost chip. Real pointer throughout; its money children (G0 + every landed probe) already ran
          # as their own steps above, so --no-subgates here.
          node tools/sweep/probe-select.mjs "$PWD/src/VES_PM.html" "$PWD/fixtures/synthetic/three-sheet" "$PWD" --no-subgates 2>&1 | tee -a probes.txt
          code22=${PIPESTATUS[0]}; [ "$code" = 0 ] && code=$code22
          {
            echo '## sweep probes'
            echo
            echo '```'
            cat probes.txt
            echo '```'
            echo
            echo "exit code: $code"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $code
